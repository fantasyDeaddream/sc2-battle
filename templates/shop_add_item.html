{% extends 'base.html' %}

{% block content %}
<section class="dashboard-hero">
    <div>
        <p class="eyebrow">积分商城</p>
        <h1>添加物品</h1>
    </div>
    <div class="hero-actions">
        <a class="ghost-button" href="/shop">返回商城</a>
    </div>
</section>

<section class="surface-card form-card">
    <form method="post" action="/shop/items" enctype="multipart/form-data" class="tournament-form">
        <div class="form-grid two-columns">
            <label>
                <span>物品名称</span>
                <input name="name" type="text" required>
            </label>
            <label>
                <span>所需积分</span>
                <input name="points" type="number" min="1" required>
            </label>
        </div>
        <div class="form-grid single-column">
            <label>
                <span>物品图片</span>
                <input name="image" type="file" accept="image/*">
                <small class="field-hint">支持 PNG/JPG/WebP 格式</small>
            </label>
        </div>
        <div class="form-actions">
            <button class="primary-button" type="submit">添加物品</button>
        </div>
    </form>
</section>
{% endblock %}
