# ============================================================
#  coop.battlesc2.top - Nginx 反向代理（HTTPS + HTTP/2 + WebSocket + 大上传 + 长超时）
#  转发到 127.0.0.1:8010
#  说明：由 server/tools/setup_multisite_nginx.py 生成，改完请重新生成或直接改本文件
# ============================================================

# 与后端保持长连接：省掉每次请求重新建立 TCP 的开销（接口多的小站提速明显）
upstream coop_backend {
    server 127.0.0.1:8010;
    keepalive 32;
}

server {
    listen 80;
    server_name coop.battlesc2.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;   # 兼容写法：nginx 1.18~1.25 都支持；≥1.25.1 会给个 deprecation 警告，
                            # 想消掉警告且服务器 nginx ≥1.25.1 时，可改成：  listen 443 ssl;  +  http2 on;
    server_name coop.battlesc2.top;
    server_tokens off;

    ssl_certificate     ../ssl/coop.battlesc2.top.pem;
    ssl_certificate_key ../ssl/coop.battlesc2.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;      # 多站点共用会话缓存，重复握手更快
    ssl_session_timeout 1h;

    # 大上传：默认只有 1MB，人物卡 / 图片 / 音频上传会直接 413
    client_max_body_size  200m;
    client_body_timeout   600s;

    # 文本压缩（主配置里也开了，这里写成自包含，脱离主配置也能用）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/json
               application/javascript application/x-javascript application/xml
               application/xml+rss application/rss+xml image/svg+xml;

    # ---------- WebSocket：实时推送（聊天 / 地图 / 战斗同步）----------
    # 少了 Upgrade / Connection 头，实时推送会失效，只能退化成轮询（看起来就是「慢半拍」）
    location /ws/ {
        proxy_pass http://coop_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;            # 长连接别被 nginx 掐断
        proxy_send_timeout 3600s;
        proxy_buffering off;                 # 实时消息不缓冲，立刻下发
    }

    # ---------- 其余请求 ----------
    location / {
        proxy_pass http://coop_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";      # 配合 upstream keepalive 复用连接
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;             # 导入剧本 / 导出战报等长请求
        proxy_send_timeout 300s;
    }
}
